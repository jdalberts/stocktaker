<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockTaker Pro</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#3fb950" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StockTaker" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --green: #3fb950;
      --green-dim: #238636;
      --yellow: #d29922;
      --red: #f85149;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    /* HEADER */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--text-muted); font-weight: 400; }
    .header-stats {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
    }
    /* NAV */
    .nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
    }
    .nav-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }
    .nav-btn.active { color: var(--green); }
    .nav-btn svg { width: 20px; height: 20px; }
    /* MAIN */
    .main { padding: 16px; max-width: 600px; margin: 0 auto; }
    /* CARD */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .card-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .card-body { padding: 16px; }
    /* UPLOAD ZONE */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg);
      position: relative;
    }
    .upload-zone:hover, .upload-zone.active {
      border-color: var(--green);
      background: rgba(63,185,80,0.05);
    }
    .upload-zone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .upload-icon { font-size: 36px; margin-bottom: 8px; }
    .upload-title { font-weight: 600; margin-bottom: 4px; }
    .upload-sub { font-size: 12px; color: var(--text-muted); }
    /* PREVIEW IMAGE */
    .img-preview {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: var(--radius);
      background: var(--bg);
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    /* EXTRACTING STATE */
    .extracting-bar {
      background: var(--surface2);
      border: 1px solid var(--green-dim);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--green);
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--green-dim);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* EXTRACTED BADGE */
    .extracted-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      color: var(--green);
      background: rgba(63,185,80,0.1);
      border: 1px solid rgba(63,185,80,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: 6px;
      vertical-align: middle;
    }
    /* FORM */
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent);
    }
    .field input.auto-filled { border-color: var(--green-dim); }
    .field select option { background: var(--surface); }
    .field textarea { resize: vertical; min-height: 60px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    /* UNIT BUTTONS */
    .unit-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .unit-btn {
      padding: 8px 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .unit-btn.selected {
      border-color: var(--green);
      color: var(--green);
      background: rgba(63,185,80,0.1);
    }
    /* BUTTONS */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: var(--radius);
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: var(--green-dim);
      color: #fff;
    }
    .btn-primary:hover { background: var(--green); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    .btn-secondary:hover { color: var(--text); border-color: var(--text-muted); }
    .btn-danger {
      background: transparent;
      color: var(--red);
      border: 1px solid rgba(248,81,73,0.3);
    }
    .btn-danger:hover { background: rgba(248,81,73,0.1); }
    /* ERROR */
    .error-box {
      background: rgba(248,81,73,0.1);
      border: 1px solid rgba(248,81,73,0.3);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--red);
      font-size: 13px;
      margin-bottom: 14px;
    }
    /* SUCCESS */
    .success-box {
      background: rgba(63,185,80,0.1);
      border: 1px solid rgba(63,185,80,0.2);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--green);
      font-size: 13px;
      margin-bottom: 14px;
    }
    /* STOCK LIST */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .list-title {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
    }
    .btn-export {
      padding: 7px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .btn-export:hover { border-color: var(--accent); background: rgba(88,166,255,0.05); }
    /* SEARCH */
    .search-wrap { margin-bottom: 14px; position: relative; }
    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px 10px 36px;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      outline: none;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
    }
    /* ENTRY CARD */
    .entry-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      transition: border-color 0.15s;
    }
    .entry-card:hover { border-color: var(--text-muted); }
    .entry-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .entry-name {
      font-weight: 600;
      font-size: 15px;
      line-height: 1.3;
    }
    .entry-qty {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--green);
      white-space: nowrap;
    }
    .entry-qty span {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tag {
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--bg);
    }
    .tag.expiry-ok { color: var(--green); border-color: rgba(63,185,80,0.3); background: rgba(63,185,80,0.05); }
    .tag.expiry-warn { color: var(--yellow); border-color: rgba(210,153,34,0.3); background: rgba(210,153,34,0.05); }
    .tag.expiry-expired { color: var(--red); border-color: rgba(248,81,73,0.3); background: rgba(248,81,73,0.05); }
    .entry-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .entry-date { font-size: 11px; color: var(--text-muted); }
    .entry-notes { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-style: italic; }
    .btn-del {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      line-height: 1;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .btn-del:hover { color: var(--red); background: rgba(248,81,73,0.1); }
    /* SUMMARY */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .stat-label {
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .stat-value {
      font-family: 'Space Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .stat-value.green { color: var(--green); }
    .stat-value.yellow { color: var(--yellow); }
    .stat-value.red { color: var(--red); }
    /* PRODUCT BREAKDOWN */
    .breakdown-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .breakdown-item:last-child { border-bottom: none; }
    .breakdown-name { font-weight: 500; }
    .breakdown-qty {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--green);
    }
    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
    .empty-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .empty-sub { font-size: 13px; }
    /* API KEY */
    .api-setup {
      background: rgba(88,166,255,0.05);
      border: 1px solid rgba(88,166,255,0.2);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
    }
    .api-setup-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .api-setup p {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .api-setup input {
      width: 100%;
      background: var(--bg);
      border: 1px solid rgba(88,166,255,0.3);
      border-radius: var(--radius);
      padding: 9px 12px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      outline: none;
    }
    .api-key-note {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    @media (max-width: 400px) {
      .stat-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">STOCK<span>TAKER</span></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <button id="installBtn" style="display:none;background:var(--green);color:#000;border:none;padding:6px 14px;border-radius:var(--radius);font-weight:600;font-size:13px;cursor:pointer;font-family:'Barlow',sans-serif;">⬇ Install</button>
    <div class="header-stats" id="headerStats">0 items</div>
  </div>
</div>

<div class="main" id="app">
  <!-- Content injected by JS -->
</div>

<nav class="nav">
  <button class="nav-btn active" id="navScan" onclick="setView('scan')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    Scan
  </button>
  <button class="nav-btn" id="navList" onclick="setView('list')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Stock List
  </button>
  <button class="nav-btn" id="navSummary" onclick="setView('summary')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    Summary
  </button>
</nav>

<script>
// ============================================================
// STATE
// ============================================================
let state = {
  view: 'scan',
  entries: JSON.parse(localStorage.getItem('stockEntries') || '[]'),
  apiKey: localStorage.getItem('apiKey') || '',
  form: {
    imageDataUrl: null,
    imageBase64: null,
    imageMime: 'image/jpeg',
    productName: '',
    expiryDate: '',
    lotNumber: '',
    quantity: '',
    unit: 'Bags',
    stockDate: new Date().toISOString().split('T')[0],
    notes: ''
  },
  extracting: false,
  extracted: false,
  error: '',
  success: '',
  searchQuery: ''
};

function saveEntries() {
  localStorage.setItem('stockEntries', JSON.stringify(state.entries));
}

function saveApiKey(key) {
  state.apiKey = key;
  localStorage.setItem('apiKey', key);
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const app = document.getElementById('app');
  const count = state.entries.length;
  document.getElementById('headerStats').textContent = count + ' item' + (count !== 1 ? 's' : '') + ' recorded';
  
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav' + capitalize(state.view)).classList.add('active');

  if (state.view === 'scan') app.innerHTML = renderScan();
  else if (state.view === 'list') app.innerHTML = renderList();
  else app.innerHTML = renderSummary();
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ============================================================
// SCAN VIEW
// ============================================================
function renderScan() {
  const f = state.form;
  const units = ['Bags','Flowbins','Canisters'];
  
  return `
    ${!state.apiKey ? `
    <div class="api-setup">
      <div class="api-setup-title">🔑 API Key Required for Auto-Scan</div>
      <p>To automatically scan labels, enter your Anthropic API key below. It's stored only in your browser — never sent anywhere else. You can still add items manually without a key.</p>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." value="${state.apiKey}" oninput="handleApiKey(this.value)" />
      <div class="api-key-note">Get your key at console.anthropic.com → API Keys</div>
    </div>` : ''}

    ${state.error ? `<div class="error-box">⚠️ ${state.error}</div>` : ''}
    ${state.success ? `<div class="success-box">✓ ${state.success}</div>` : ''}

    <div class="card">
      <div class="card-header">📷 Scan Label</div>
      <div class="card-body">
        ${f.imageDataUrl ? `
          <img src="${f.imageDataUrl}" class="img-preview" />
          ${state.extracting ? `
            <div class="extracting-bar">
              <div class="spinner"></div>
              Reading label with AI...
            </div>` : ''}
          <button class="btn btn-secondary" onclick="clearImage()" style="margin-bottom:0;margin-top:0;width:auto;padding:6px 14px;font-size:12px;">
            ↩ Use different image
          </button>
        ` : `
          <div class="upload-zone" id="dropZone">
            <input type="file" accept="image/*" capture="environment" onchange="handleImageFile(this)" />
            <div class="upload-icon">📸</div>
            <div class="upload-title">Take Photo or Upload</div>
            <div class="upload-sub">Tap to open camera or choose from gallery</div>
          </div>
        `}
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        📋 Product Details
        ${state.extracted ? '<span class="extracted-badge">✓ AUTO-FILLED</span>' : ''}
      </div>
      <div class="card-body">
        <div class="field">
          <label>Product Name *</label>
          <input type="text" class="${state.extracted ? 'auto-filled' : ''}" value="${escHtml(f.productName)}" oninput="updateForm('productName', this.value)" placeholder="e.g. Clex® Eukatol drink" />
        </div>
        <div class="field-row">
          <div class="field">
            <label>Expiry / Best Before</label>
            <input type="text" class="${state.extracted ? 'auto-filled' : ''}" value="${escHtml(f.expiryDate)}" oninput="updateForm('expiryDate', this.value)" placeholder="MM/YYYY" />
          </div>
          <div class="field">
            <label>Lot / Batch No.</label>
            <input type="text" class="${state.extracted ? 'auto-filled' : ''}" value="${escHtml(f.lotNumber)}" oninput="updateForm('lotNumber', this.value)" placeholder="e.g. 427739" />
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">📦 Stock Count</div>
      <div class="card-body">
        <div class="field">
          <label>Quantity *</label>
          <input type="number" min="0" step="0.5" value="${f.quantity}" oninput="updateForm('quantity', this.value)" placeholder="0" />
        </div>
        <div class="field">
          <label>Unit Type</label>
          <div class="unit-grid">
            ${units.map(u => `<button class="unit-btn ${f.unit === u ? 'selected' : ''}" onclick="updateForm('unit','${u}')">${u}</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Stock Date</label>
          <input type="date" value="${f.stockDate}" oninput="updateForm('stockDate', this.value)" />
        </div>
        <div class="field">
          <label>Notes (optional)</label>
          <textarea oninput="updateForm('notes', this.value)" placeholder="Location, condition, etc.">${escHtml(f.notes)}</textarea>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="addEntry()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add to Stock
    </button>
    <button class="btn btn-secondary" onclick="resetForm()">Clear Form</button>
  `;
}

// ============================================================
// LIST VIEW
// ============================================================
function renderList() {
  const q = state.searchQuery.toLowerCase();
  const filtered = state.entries.filter(e =>
    e.productName.toLowerCase().includes(q) ||
    (e.lotNumber || '').toLowerCase().includes(q) ||
    (e.notes || '').toLowerCase().includes(q)
  );

  return `
    <div class="list-header">
      <div class="list-title">${state.entries.length} ENTRIES</div>
      ${state.entries.length > 0 ? `
        <button class="btn-export" onclick="exportCSV()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>` : ''}
    </div>

    ${state.entries.length > 3 ? `
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Search products, lot numbers..." value="${escHtml(state.searchQuery)}" oninput="handleSearch(this.value)" />
      </div>` : ''}

    ${filtered.length === 0 ? `
      <div class="empty-state">
        <div class="empty-icon">${state.entries.length === 0 ? '📦' : '🔍'}</div>
        <div class="empty-title">${state.entries.length === 0 ? 'No stock recorded yet' : 'No results found'}</div>
        <div class="empty-sub">${state.entries.length === 0 ? 'Go to Scan to add your first item.' : 'Try a different search term.'}</div>
      </div>` : ''}

    ${filtered.map(e => renderEntry(e)).join('')}
  `;
}

function renderEntry(e) {
  const es = getExpiryStatus(e.expiryDate);
  const esClass = es ? 'expiry-' + es : '';
  const esLabel = es === 'expired' ? '⚠ EXPIRED' : es === 'warning' ? '⏳ Expiring Soon' : '';

  return `
    <div class="entry-card">
      <div class="entry-top">
        <div>
          <div class="entry-name">${escHtml(e.productName)}</div>
          ${e.notes ? `<div class="entry-notes">${escHtml(e.notes)}</div>` : ''}
        </div>
        <div class="entry-qty">${e.quantity}<br><span>${escHtml(e.unit)}</span></div>
      </div>
      <div class="entry-meta">
        ${e.lotNumber ? `<span class="tag">LOT: ${escHtml(e.lotNumber)}</span>` : ''}
        ${e.expiryDate ? `<span class="tag ${esClass}">EXP: ${escHtml(e.expiryDate)}${esLabel ? ' ' + esLabel : ''}</span>` : ''}
        <span class="tag">📅 ${e.stockDate}</span>
      </div>
      <div class="entry-footer">
        <div class="entry-date">Added ${timeAgo(e.addedAt)}</div>
        <button class="btn-del" onclick="deleteEntry(${e.id})" title="Delete">🗑</button>
      </div>
    </div>
  `;
}

// ============================================================
// SUMMARY VIEW
// ============================================================
function renderSummary() {
  const entries = state.entries;
  const total = entries.length;
  const expired = entries.filter(e => getExpiryStatus(e.expiryDate) === 'expired').length;
  const warning = entries.filter(e => getExpiryStatus(e.expiryDate) === 'warning').length;
  
  // Group by product
  const products = {};
  entries.forEach(e => {
    const key = e.productName.toLowerCase();
    if (!products[key]) products[key] = { name: e.productName, total: 0, unit: e.unit };
    products[key].total += e.quantity;
  });
  const productList = Object.values(products).sort((a, b) => b.total - a.total);

  // Group by unit type
  const byUnit = {};
  entries.forEach(e => {
    byUnit[e.unit] = (byUnit[e.unit] || 0) + e.quantity;
  });

  return `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Total Entries</div>
        <div class="stat-value">${total}</div>
        <div class="stat-sub">stock records</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Products</div>
        <div class="stat-value">${Object.keys(products).length}</div>
        <div class="stat-sub">unique items</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Expiring Soon</div>
        <div class="stat-value yellow">${warning}</div>
        <div class="stat-sub">within 90 days</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Expired</div>
        <div class="stat-value red">${expired}</div>
        <div class="stat-sub">need attention</div>
      </div>
    </div>

    ${productList.length > 0 ? `
      <div class="card">
        <div class="card-header">📦 Stock by Product</div>
        <div class="card-body" style="padding: 0 16px;">
          ${productList.map(p => `
            <div class="breakdown-item">
              <span class="breakdown-name">${escHtml(p.name)}</span>
              <span class="breakdown-qty">${p.total} ${escHtml(p.unit)}</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-header">📊 Stock by Unit Type</div>
        <div class="card-body" style="padding: 0 16px;">
          ${Object.entries(byUnit).map(([u, q]) => `
            <div class="breakdown-item">
              <span class="breakdown-name">${escHtml(u)}</span>
              <span class="breakdown-qty">${q}</span>
            </div>`).join('')}
        </div>
      </div>
    ` : `
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-title">No data yet</div>
        <div class="empty-sub">Start scanning to see your summary.</div>
      </div>
    `}

    ${entries.length > 0 ? `
      <button class="btn btn-danger" onclick="confirmClearAll()">🗑 Clear All Data</button>
    ` : ''}
  `;
}

// ============================================================
// ACTIONS
// ============================================================
function setView(v) {
  state.view = v;
  state.error = '';
  state.success = '';
  render();
}

function updateForm(field, val) {
  state.form[field] = val;
  render();
}

function clearImage() {
  state.form.imageDataUrl = null;
  state.form.imageBase64 = null;
  state.extracted = false;
  state.form.productName = '';
  state.form.expiryDate = '';
  state.form.lotNumber = '';
  render();
}

function resetForm() {
  state.form = {
    imageDataUrl: null, imageBase64: null, imageMime: 'image/jpeg',
    productName: '', expiryDate: '', lotNumber: '',
    quantity: '', unit: 'Bags',
    stockDate: new Date().toISOString().split('T')[0],
    notes: ''
  };
  state.extracted = false;
  state.error = '';
  state.success = '';
  render();
}

function handleApiKey(val) {
  saveApiKey(val.trim());
}

function handleSearch(val) {
  state.searchQuery = val;
  render();
}

function handleImageFile(input) {
  const file = input.files[0];
  if (!file) return;
  state.extracting = true;
  state.error = '';
  render();

  const reader = new FileReader();
  reader.onload = async (ev) => {
    const dataUrl = ev.target.result;
    state.form.imageDataUrl = dataUrl;

    // Compress image to max 1200px wide, JPEG quality 0.7 to stay under Vercel limits
    const compressed = await compressImage(dataUrl, 1200, 0.7);
    state.form.imageBase64 = compressed.base64;
    state.form.imageMime = compressed.mime;
    await extractLabel(compressed.base64, compressed.mime);
  };
  reader.readAsDataURL(file);
}

function compressImage(dataUrl, maxWidth, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width;
      let h = img.height;
      if (w > maxWidth) {
        h = Math.round(h * maxWidth / w);
        w = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', quality);
      resolve({
        base64: compressed.split(',')[1],
        mime: 'image/jpeg'
      });
    };
    img.src = dataUrl;
  });
}

async function extractLabel(base64, mime) {
  if (!state.apiKey) {
    state.extracting = false;
    state.error = 'No API key set. Please enter your API key above, or fill in the details manually.';
    render();
    return;
  }
  try {
    const resp = await fetch("/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        apiKey: state.apiKey,
        image: base64,
        mime: mime
      })
    });
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error('Server ' + resp.status + ': ' + errText);
    }
    const data = await resp.json();
    if (data.error) throw new Error(typeof data.error === 'string' ? data.error : data.error.message);
    const text = data.content[0].text;
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    state.form.productName = parsed.productName || '';
    state.form.expiryDate = parsed.expiryDate || '';
    state.form.lotNumber = parsed.lotNumber || '';
    state.extracted = true;
  } catch(err) {
    state.error = 'Auto-scan failed: ' + (err.message || 'Network error');
    state.extracted = false;
  }
  state.extracting = false;
  render();
}

function addEntry() {
  const f = state.form;
  if (!f.productName.trim()) { state.error = 'Product name is required.'; render(); return; }
  if (!f.quantity || isNaN(f.quantity) || parseFloat(f.quantity) < 0) { state.error = 'Please enter a valid quantity.'; render(); return; }
  
  const entry = {
    id: Date.now(),
    productName: f.productName.trim(),
    expiryDate: f.expiryDate.trim(),
    lotNumber: f.lotNumber.trim(),
    quantity: parseFloat(f.quantity),
    unit: f.unit,
    stockDate: f.stockDate,
    notes: f.notes.trim(),
    addedAt: new Date().toISOString()
  };
  state.entries.unshift(entry);
  saveEntries();
  state.success = `"${entry.productName}" added — ${entry.quantity} ${entry.unit}`;
  resetForm();
  state.success = `✓ Added successfully! Go to Stock List to view.`;
  render();
}

function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  state.entries = state.entries.filter(e => e.id !== id);
  saveEntries();
  render();
}

function confirmClearAll() {
  if (!confirm('⚠️ Delete ALL stock data? This cannot be undone.')) return;
  state.entries = [];
  saveEntries();
  render();
}

function exportCSV() {
  const headers = ['Product Name','Expiry Date','Lot Number','Quantity','Unit','Stock Date','Notes'];
  const rows = state.entries.map(e => [
    e.productName, e.expiryDate, e.lotNumber, e.quantity, e.unit, e.stockDate, e.notes
  ]);
  const csv = [headers, ...rows].map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'stock-' + new Date().toISOString().split('T')[0] + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============================================================
// HELPERS
// ============================================================
function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getExpiryStatus(expiryDate) {
  if (!expiryDate) return null;
  let d;
  // Try various formats
  const mmyyyy = expiryDate.match(/^(\d{1,2})[\/\-](\d{4})$/);
  const yyyymm = expiryDate.match(/^(\d{4})[\/\-](\d{2})$/);
  if (mmyyyy) d = new Date(mmyyyy[2], parseInt(mmyyyy[1]) - 1, 28);
  else if (yyyymm) d = new Date(yyyymm[1], parseInt(yyyymm[2]) - 1, 28);
  else d = new Date(expiryDate);
  if (isNaN(d)) return null;
  const now = new Date();
  const diffDays = (d - now) / 86400000;
  if (diffDays < 0) return 'expired';
  if (diffDays < 90) return 'warning';
  return 'ok';
}

function timeAgo(iso) {
  const d = new Date(iso);
  const diff = Date.now() - d;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  return days + 'd ago';
}

// INIT
// ============================================================

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: '.' })
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.error('SW registration failed:', err));
  });
}

// PWA Install Prompt
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block';
  console.log('Install prompt captured');
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const result = await deferredPrompt.userChoice;
  console.log('Install result:', result.outcome);
  deferredPrompt = null;
  installBtn.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  console.log('App installed');
  installBtn.style.display = 'none';
  deferredPrompt = null;
});
</script>
