<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockTaker Pro</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#3fb950" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StockTaker" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

<div class="header">
  <div class="logo">STOCK<span>TAKER</span></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <button id="installBtn" style="display:none;background:var(--green);color:#000;border:none;padding:6px 14px;border-radius:var(--radius);font-weight:600;font-size:13px;cursor:pointer;font-family:'Barlow',sans-serif;">⬇ Install</button>
    <div class="header-stats" id="headerStats">0 items</div>
  </div>
</div>

<div class="main" id="app">
  <!-- Content injected by JS -->
</div>

<nav class="nav">
  <button class="nav-btn active" id="navScan" onclick="setView('scan')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    Scan
  </button>
  <button class="nav-btn" id="navList" onclick="setView('list')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Stock List
  </button>
  <button class="nav-btn" id="navSummary" onclick="setView('summary')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    Summary
  </button>
</nav>

<script src="./app.js"></script>
</body>
</html>
